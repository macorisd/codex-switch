<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP}}; script-src 'nonce-{{NONCE}}';">
  <link rel="stylesheet" href="{{STYLE}}">
  <title>Codex Switch</title>
</head>
<body>
  <main>
    <section class="current" aria-labelledby="current-label">
      <h1 id="current-label">Current Configuration</h1>
      <strong id="current" aria-live="polite"></strong>
    </section>

    <section class="provider-section" aria-labelledby="provider-label">
      <div class="provider-heading">
        <h2 id="provider-label">Provider</h2>
        <button class="text-button" id="manage-providers" aria-expanded="false">Manage Providers</button>
      </div>

      <div class="manage-panel" id="manage-panel" hidden>
        <button class="manage-close" id="close-manage" type="button" aria-label="Close Manage Providers">&times;</button>
        <ul class="manage-list" id="manage-list" aria-label="All providers"></ul>
      </div>

      <div class="provider-list" id="provider-list" hidden>
        <article class="provider-card" data-provider="openai">
          <header>
            <h3>ChatGPT</h3>
            <p>Your Plan</p>
          </header>
          <button class="primary" id="openai">Switch to ChatGPT</button>
        </article>

        <article class="provider-card" data-provider="deepseek">
          <header>
            <h3>DeepSeek</h3>
            <p>API key</p>
          </header>
          <div class="credential-row">
            <div class="credential-status">
              <span class="status-dot not-configured" id="key-dot" aria-hidden="true"></span>
              <span id="key-status">Not configured</span>
            </div>
            <button class="text-button" id="set-key">Set API key</button>
          </div>

          <details class="model-catalog" id="model-catalog">
            <summary>Model catalog</summary>
            <div class="model-catalog-content">
              <ul class="model-list" id="models" aria-label="Available DeepSeek models"></ul>
              <button class="secondary-button" id="refresh">Update model catalog</button>
            </div>
          </details>

          <button class="secondary-button wide" id="verify">Check connection</button>
          <div class="action-feedback" id="action-feedback" role="status" aria-live="polite" hidden>
            <span id="feedback-text"></span>
          </div>

          <section class="usage" aria-labelledby="usage-label">
            <h4 id="usage-label">Usage</h4>
            <div class="usage-balance-row">
              <div class="usage-balance-copy">
                <span class="usage-label">Available balance</span>
                <strong id="balance-value">--</strong>
              </div>
              <button class="icon-button" id="balance-update" type="button" aria-label="Update available balance">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M13 5.5A5.5 5.5 0 0 0 3.2 4.1L2 6M2 2.5V6h3.5M3 10.5a5.5 5.5 0 0 0 9.8 1.4L14 10m0 3.5V10h-3.5"/>
                </svg>
              </button>
            </div>
            <button class="text-button alert-toggle" id="balance-alert-toggle" type="button" aria-expanded="false">Balance alert</button>
            <div class="balance-alert-editor" id="balance-alert-editor" hidden>
              <span aria-hidden="true">$</span>
              <input id="balance-threshold" type="number" min="0" step="0.01" inputmode="decimal" aria-label="Low balance alert in US dollars">
            </div>
          </section>

          <button class="primary" id="deepseek-switch">Switch to DeepSeek</button>
        </article>
      </div>
    </section>
  </main>
  <script nonce="{{NONCE}}" src="{{SCRIPT}}"></script>
</body>
</html>
