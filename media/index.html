<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP}}; script-src 'nonce-{{NONCE}}';">
  <link rel="stylesheet" href="{{STYLE}}">
  <title>Codex Switch</title>
</head>
<body>
  <main>
    <section class="current" aria-labelledby="current-label">
      <h1 id="current-label">Current Configuration</h1>
      <strong id="current" aria-live="polite"></strong>
    </section>

    <section class="provider-section" aria-labelledby="provider-label">
      <h2 id="provider-label">Provider</h2>

      <article class="provider-card">
        <header>
          <h3>ChatGPT</h3>
          <p>Your Plan</p>
        </header>
        <button class="primary" id="openai">Switch to ChatGPT</button>
      </article>

      <article class="provider-card">
        <header>
          <h3>DeepSeek</h3>
          <p>API key</p>
        </header>
        <input id="key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="DeepSeek API key">
        <ul class="model-list" id="models" aria-label="Available DeepSeek models"></ul>
        <div class="secondary-actions">
          <button id="refresh">Update model catalog</button>
          <button id="verify">Check connection</button>
        </div>
        <button class="primary" id="deepseek-switch">Switch to DeepSeek</button>
      </article>
    </section>
  </main>
  <script nonce="{{NONCE}}" src="{{SCRIPT}}"></script>
</body>
</html>
