<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{CSP}}; style-src {{CSP}}; script-src 'nonce-{{NONCE}}';">
  <link rel="stylesheet" href="{{STYLE}}">
  <title>Codex Switch</title>
</head>
<body>
  <main>
    <section class="current" aria-labelledby="current-label">
      <h1 id="current-label">Current Configuration</h1>
      <div class="current-row">
        <strong id="current" aria-live="polite"></strong>
        <button class="icon-button" id="sync-all" type="button" aria-label="Refresh all visible providers" title="Refresh all visible providers">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13 5.5A5.5 5.5 0 0 0 3.2 4.1L2 6M2 2.5V6h3.5M3 10.5a5.5 5.5 0 0 0 9.8 1.4L14 10m0 3.5V10h-3.5"/>
          </svg>
        </button>
      </div>
    </section>

    <section class="provider-section" aria-labelledby="provider-label">
      <div class="provider-heading">
        <h2 id="provider-label">Provider</h2>
        <button class="text-button" id="manage-providers" aria-expanded="false">Manage Providers</button>
      </div>

      <div class="manage-panel" id="manage-panel" hidden>
        <button class="manage-close" id="close-manage" type="button" aria-label="Close Manage Providers">&times;</button>
        <ul class="manage-list" id="manage-list" aria-label="All providers"></ul>
      </div>

      <div class="provider-list" id="provider-list" hidden>
        <article class="provider-card" data-provider="openai">
          <header class="provider-header">
            <div class="provider-identity">
              <span class="provider-icon chatgpt-icon"><img src="{{CHATGPT_ICON}}" width="24" height="24" alt=""></span>
              <div class="provider-title">
                <h3>ChatGPT</h3>
                <p id="chatgpt-plan">Your Plan</p>
              </div>
            </div>
          </header>
          <div class="credential-status chatgpt-status">
            <span class="status-dot loading" id="chatgpt-dot" aria-hidden="true"></span>
            <span id="chatgpt-status">Loading...</span>
          </div>
          <div id="chatgpt-usage" class="chatgpt-usage" hidden>
            <p id="chatgpt-stale" class="usage-note" hidden>Usage unavailable. Previous data may be out of date.</p>
            <div class="usage-window">
              <div class="usage-window-heading"><span id="five-hour-label">5-hour usage remaining</span><strong id="five-hour-value">Unavailable</strong></div>
              <progress id="five-hour-bar" max="100" aria-labelledby="five-hour-label" hidden></progress>
              <p class="usage-note" id="five-hour-reset"></p>
              <p class="usage-note" id="five-hour-countdown"></p>
            </div>
            <div class="usage-window">
              <div class="usage-window-heading"><span id="weekly-label">Weekly usage remaining</span><strong id="weekly-value">Unavailable</strong></div>
              <progress id="weekly-bar" max="100" aria-labelledby="weekly-label" hidden></progress>
              <p class="usage-note" id="weekly-reset"></p>
              <p class="usage-note" id="weekly-countdown"></p>
            </div>
            <div class="banked-resets"><span>Banked resets</span><strong id="banked-resets">Unavailable</strong></div>
          </div>
          <button class="primary" id="openai">Switch to ChatGPT</button>
        </article>


      </div>
    </section>
  </main>
  <script nonce="{{NONCE}}" src="{{ALERT_SCRIPT}}"></script>
  <script nonce="{{NONCE}}" src="{{API_SCRIPT}}"></script>
  <script nonce="{{NONCE}}" src="{{SCRIPT}}"></script>
</body>
</html>
