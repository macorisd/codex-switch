name: Platform compatibility
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
        python: ['3.14']
        include:
          - os: windows-latest
            python: '3.11'
          - os: macos-15-intel
            python: '3.11'
          - os: ubuntu-latest
            python: '3.11'
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r backend/requirements.txt
      - name: Install Linux system keyring
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Test against Linux Secret Service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -e -c '
            printf "%s" "isolated-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets
            npm test
          '
      - name: Test native credential store and providers
        if: runner.os != 'Linux'
        run: npm test
      - run: npm run package
